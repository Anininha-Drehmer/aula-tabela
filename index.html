<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        tr, td{
            border: 1px solid black;
        }
        tfoot {
            background-color: rgb(107, 209, 235);
        }
    </style>




</head>
<body>
    
    <table>
        <thead>
            <tr>
                <th>Produtos </th>
                <th>Quantidade</th>
                <th>Precço</th>
                <th>Black Friday</th>

            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Produto 2</td>
                <td>2</td>
                <td>R$5</td>
                <td rowspan="2">sim</td>
            </tr>
            <tr>
                <td>Produto 3</td>
                <td>5</td>
                <td>R$10</td>
                
            </tr>
            <tr>
                <td>Produto 4</td>
                <td>3</td>
                <td>R$15</td>
                <td>não</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td colspan="2">R$30</td>
            </tr>


        </tfoot>
        



    </table>
</body>
</html>
